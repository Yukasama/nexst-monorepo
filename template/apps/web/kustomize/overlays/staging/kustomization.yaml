apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: nexst-staging

images:
  - name: nexst-web
    newName: ghcr.io/your-org/nexst-web
    newTag: test

configMapGenerator:
  - name: nexst-web-config
    behavior: merge
    envs:
      - application.properties
