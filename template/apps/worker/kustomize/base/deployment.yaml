apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexst-worker
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      serviceAccountName: ghcr-puller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexst-worker
          image: nexst-worker
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: nexst-worker-config
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: &redis-ping
                - bun
                - -e
                - "new (require('ioredis').default)({host:process.env.REDIS_HOST,port:Number(process.env.REDIS_PORT)}).ping().then(()=>process.exit(0),()=>process.exit(1))"
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            exec:
              command: *redis-ping
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
