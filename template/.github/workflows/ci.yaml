name: CI

# Pushes to main run this through deploy.yaml, which deploys only when it passes.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  # Called from deploy.yaml, github.workflow is the caller's name; a group equal
  # to the caller's would cancel this run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Decides which app(s) a push/PR touches so only the affected pipeline(s)
  # run. Shared root files (lockfile, workspace/turbo config) affect all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      # @if worker
      worker: ${{ steps.filter.outputs.worker }}
      # @endif
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'packages/**'
            web:
              - *shared
              - 'apps/web/**'
            api:
              - *shared
              - 'apps/api/**'
            # @if worker
            worker:
              - *shared
              - 'apps/worker/**'
            # @endif

  outdated:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun outdated -r

  # ---------------------------------------------------------------- web ----
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-web-${{ github.sha }}
          restore-keys: turbo-web-

      - name: Typecheck
        run: bunx turbo run lint:ts --filter=@nexst/web

      - name: Lint
        run: bunx turbo run lint fmt:check --filter=@nexst/web

      - name: Build
        run: bunx turbo run build --filter=@nexst/web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Vitest (unit + Storybook interaction/a11y)
        run: cd apps/web && bun run test:unit

      - name: Playwright
        run: cd apps/web && bun run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------- api ----
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-api-${{ github.sha }}
          restore-keys: turbo-api-

      - name: Generate Prisma client
        run: cd apps/api && bunx --bun prisma generate

      - name: Typecheck
        run: bunx turbo run lint:ts --filter=@nexst/api

      - name: Lint
        run: bunx turbo run lint fmt:check --filter=@nexst/api

      - name: Codes-only error responses
        run: cd apps/api && bun run lint:error-codes

      - name: Unit tests
        run: cd apps/api && bun run test:cov

      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          retention-days: 1

  api-e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nexst_user
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: nexst_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexst_user -d nexst_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # @if worker
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # @endif
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexst_user:test-pw@localhost:5432/nexst_db?schema=nexst_user
      # @if auth
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3001
      # @endif
      # @if r2
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET: ci
      R2_ENDPOINT: https://ci.r2.cloudflarestorage.com
      # @endif
      # @if worker
      REDIS_HOST: localhost
      # @endif
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare database
        run: |
          cd apps/api
          bunx --bun prisma generate
          bunx --bun prisma migrate deploy

      - name: Start API
        run: |
          cd apps/api
          PRISMA_AUTO_MIGRATE=false bun src/main.ts > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: E2E tests
        run: cd apps/api && bun run test:e2e

      - name: API log
        if: failure()
        run: cat apps/api/api.log
  # @if worker

  # ------------------------------------------------------------- worker ----
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-worker-${{ github.sha }}
          restore-keys: turbo-worker-

      - name: Typecheck
        run: bunx turbo run lint:ts --filter=@nexst/worker --filter=@nexst/queues

      - name: Lint
        run: bunx turbo run lint fmt:check --filter=@nexst/worker --filter=@nexst/queues

      - name: Unit tests
        run: cd apps/worker && bun run test:unit
  # @endif

  # -------------------------------------------------------------- sonar ----
  # Skipped until the SONAR_TOKEN secret exists.
  sonar:
    needs: [changes, web, api]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # @if worker
        app: [web, api, worker]
        # @endif
        # @if !worker
        # app: [web, api]
        # @endif
    steps:
      - uses: actions/checkout@v6
        if: env.SONAR_TOKEN != '' && needs.changes.outputs[matrix.app] == 'true'
        with:
          fetch-depth: 0
      - name: Download coverage
        if: env.SONAR_TOKEN != '' && needs.changes.outputs[matrix.app] == 'true' && matrix.app == 'api'
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && needs.changes.outputs[matrix.app] == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: apps/${{ matrix.app }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
