name: Publish App Image

on:
  workflow_call:
    inputs:
      app:
        # @if worker
        description: Bake target (web, api, api-migrate, worker) — also the image suffix
        # @endif
        # @if !worker
        # description: Bake target (web, api, api-migrate) — also the image suffix
        # @endif
        required: true
        type: string

jobs:
  docker:
    # Images target linux/arm64 only: build natively, no QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexst-${{ inputs.app }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_REGISTRY_USERNAME }}
          password: ${{ secrets.DHI_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: ${{ inputs.app }}
          push: true
          set: |
            ${{ inputs.app }}.cache-from=type=registry,ref=${{ steps.image.outputs.name }}:buildcache
            ${{ inputs.app }}.cache-to=type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,compression=zstd,ignore-error=true
        env:
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} # @if auth
